<!DOCTYPE html>
<html>
<head>
    <title>Join a Club | Student Club Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Student Club Management System</h2>
        <nav>
            <a href="home.html">Home</a> |
            <a href="clubs.html">Clubs</a> |
            <a href="join.html">Join Us</a> |
            <a href="events.html">Events</a> |
            <a href="attendance.html">Attendance</a> |
            <a href="activities.html">Reports</a> |
            <a href="admin.html">Admin</a>
        </nav>
    </header>
    <main>
        <h1>Membership Request Form</h1>
        <p>Fill in the details below to show your interest in a club.</p>
        <form>
            <label for="student">Student Name:</label><br>
            <input type="text" id="student" name="student" required><br><br>
            <label for="number">Phone Number:</label><br>
            <input type="tel" id="number" name="number" required><br><br>
            <label for="club">Club Name:</label><br>
            <input type="text" id="club" name="club" required><br><br>
            <label for="reason">Why do you want to join?</label><br>
            <textarea id="reason" name="reason" rows="4" required></textarea><br><br>
            <input type="submit" value="Submit Request">
        </form>
        <p class="note">Note: this is HTML only, form does not save or send your request.</p>
    </main>
    <footer><p>Student Club Management System</p></footer>
</body>
</html>
